<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">Acesso Restrito</h1>
        
        {% if error %}
        <div class="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Usuário</label>
                <input type="text" name="username" required class="w-full border rounded p-2 focus:border-indigo-500 outline-none" />
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Senha</label>
                <input type="password" name="password" required class="w-full border rounded p-2 focus:border-indigo-500 outline-none" />
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 text-white rounded p-2 font-bold hover:bg-indigo-700 transition">
                Entrar
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="/" class="text-sm text-slate-500 hover:text-indigo-600 underline">Voltar à tela inicial</a>
        </div>
    </div>
</body>
</html>
